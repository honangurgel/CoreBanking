name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CoreBanking.sln

      - name: Build
        run: dotnet build CoreBanking.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test CoreBanking.sln --no-build --configuration Release

      - name: Test Prometheus alert rules
        run: docker run --rm --entrypoint promtool --volume "$PWD/observability:/etc/prometheus:ro" prom/prometheus:v3.7.3 test rules /etc/prometheus/alerts.test.yml

  images:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, worker, simulator]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        env:
          COMPONENT: ${{ matrix.component }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY_OWNER,,}/corebanking-${COMPONENT}:sha-${GITHUB_SHA}"
          docker build --target "$COMPONENT" --label "org.opencontainers.image.source=$SOURCE_URL" --tag "$image" .
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Smoke test simulator image
        if: matrix.component == 'simulator'
        run: |
          container="$(docker run --detach --rm --publish 127.0.0.1::8080 "$IMAGE")"
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then docker logs "$container"; fi
            docker stop "$container" >/dev/null
          }
          trap cleanup EXIT
          address="$(docker port "$container" 8080)"
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 --max-time 2 "http://127.0.0.1:${address##*:}/health"

      - name: Sign in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE"
