name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CoreBanking.sln

      - name: Build
        run: dotnet build CoreBanking.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test CoreBanking.sln --no-build --configuration Release
