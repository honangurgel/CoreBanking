services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: corebanking_demo
      POSTGRES_USER: corebanking_demo
      POSTGRES_PASSWORD: ${COREBANKING_DEMO_PASSWORD:?Set COREBANKING_DEMO_PASSWORD}
    ports:
      - "127.0.0.1::5432"
    volumes:
      - demo_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corebanking_demo -d corebanking_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: corebanking_demo
      RABBITMQ_DEFAULT_PASS: ${COREBANKING_DEMO_PASSWORD:?Set COREBANKING_DEMO_PASSWORD}
    volumes:
      - demo_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  simulator:
    image: ghcr.io/honangurgel/corebanking-simulator:sha-${COREBANKING_IMAGE_SHA:?Set COREBANKING_IMAGE_SHA}
    environment:
      ASPNETCORE_URLS: http://127.0.0.1:8081

  api:
    image: ghcr.io/honangurgel/corebanking-api:sha-${COREBANKING_IMAGE_SHA:?Set COREBANKING_IMAGE_SHA}
    network_mode: "service:simulator"
    depends_on:
      simulator:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://127.0.0.1:8080
      Authentication__Mode: Disabled
      ConnectionStrings__Banking: "Host=postgres;Database=corebanking_demo;Username=corebanking_demo;Password=${COREBANKING_DEMO_PASSWORD:?Set COREBANKING_DEMO_PASSWORD}"
      RabbitMQ__ConnectionString: "amqp://corebanking_demo:${COREBANKING_DEMO_PASSWORD:?Set COREBANKING_DEMO_PASSWORD}@rabbitmq:5672/"
      Pix__SimulatorUrl: http://127.0.0.1:8081

  worker:
    image: ghcr.io/honangurgel/corebanking-worker:sha-${COREBANKING_IMAGE_SHA:?Set COREBANKING_IMAGE_SHA}
    network_mode: "service:simulator"
    depends_on:
      simulator:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__Banking: "Host=postgres;Database=corebanking_demo;Username=corebanking_demo;Password=${COREBANKING_DEMO_PASSWORD:?Set COREBANKING_DEMO_PASSWORD}"
      RabbitMQ__ConnectionString: "amqp://corebanking_demo:${COREBANKING_DEMO_PASSWORD:?Set COREBANKING_DEMO_PASSWORD}@rabbitmq:5672/"
      Pix__SimulatorUrl: http://127.0.0.1:8081

volumes:
  demo_postgres:
  demo_rabbitmq:
