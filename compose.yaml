services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corebanking}
      POSTGRES_USER: ${POSTGRES_USER:-corebanking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corebanking_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-corebanking}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-corebanking_local}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    profiles: ["identity"]
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"

  jaeger:
    profiles: ["tracing"]
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:16686:16686"

volumes:
  postgres_data:
  rabbitmq_data:
